name: 시간별 스몰캡 뉴스
on:
  schedule:
    - cron: "30 14 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests beautifulsoup4
      - name: 주요 뉴스 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharma-news/scripts/send_hourly_news.py
