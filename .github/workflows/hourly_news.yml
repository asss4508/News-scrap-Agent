name: 매시간 인기 기업 뉴스
on:
  schedule:
    # 예약은 작업 시작/복구용이다. 실행 중인 작업이 KST 08~16시 정각을 직접 기다린다.
    # 03시부터 사전 대기하며, 작업당 5시간 20분 이내에 다음 대기 작업으로 넘긴다.
    # GitHub가 모든 시작 요청을 지연/누락하면 정시 발송은 여전히 보장할 수 없다.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
concurrency:
  group: hourly-news
  cancel-in-progress: false
jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 운영 시간 확인
        id: gate
        run: python3 pharma-news/scripts/hourly_news_runner.py gate
      - name: Python 설치
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        if: steps.gate.outputs.proceed == 'true'
        run: pip install requests beautifulsoup4
      - name: 주요 뉴스 전송
        if: steps.gate.outputs.proceed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python pharma-news/scripts/hourly_news_runner.py run
