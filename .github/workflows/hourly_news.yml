name: 시간별 스몰캡 뉴스
on:
  schedule:
    # 매일 2시간마다 (KST 01/03/05/07/09/11/13/15/17/19/21/23시)
    # 매 정각(0분)은 전 세계 워크플로가 몰려 GitHub 큐 지연이 커지므로,
    # 정각에서 7분 비켜서 지연을 줄인다.
    - cron: "7 */2 * * *"
  workflow_dispatch:
jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests beautifulsoup4
      - name: 주요 뉴스 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharma-news/scripts/send_hourly_news.py
      - name: 전송 이력 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hourly_sent_log.json
          git diff --cached --quiet || git commit -m "chore: 시간별 뉴스 전송 이력 업데이트"
          git push
