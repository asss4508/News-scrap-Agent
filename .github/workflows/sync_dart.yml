name: DART 공시 동기화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # 매일 오전 9시 KST (00:00 UTC)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests

      - name: DART 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python pharma-news/scripts/sync_dart.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/channels/dart_*.txt data/dart_corp_cache.json
          git diff --cached --quiet || git commit -m "chore: DART 공시 자동 업데이트 (상장사 전체)"
          git push

      - name: 인덱스 재빌드
        run: |
          pip install pypdf openpyxl python-docx
          python pharma-news/scripts/build_index.py

      - name: 인덱스 커밋
        run: |
          git add data/index.json
          git diff --cached --quiet || git commit -m "chore: 인덱스 자동 업데이트 (DART 동기화 후)"
          git push
