name: 링크 요약 봇

on:
  workflow_dispatch:
  schedule:
    # Pre-queue a successor; GitHub schedules can still be delayed or dropped.
    - cron: '17,37,57 * * * *'

concurrency:
  group: link-summary-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install "python-telegram-bot>=20.0" anthropic requests beautifulsoup4

      - name: Telegram 인증 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              sys.exit("TELEGRAM_AUTH_CHECK_FAILED: missing server secret")
          try:
              with urllib.request.urlopen("https://api.telegram.org/bot" + token + "/getMe", timeout=20) as response:
                  result = json.load(response)
              ok = result.get("ok") is True and result.get("result", {}).get("is_bot") is True
          except Exception:
              sys.exit("TELEGRAM_AUTH_CHECK_FAILED: check server credentials or connectivity")
          if not ok:
              sys.exit("TELEGRAM_AUTH_CHECK_FAILED")
          print("TELEGRAM_AUTH_OK", flush=True)
          PY

      - name: 봇 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Gracefully release Telegram polling before the runner timeout.
        run: timeout --preserve-status --signal=TERM --kill-after=5m 320m python -u pharma-news/scripts/bot_link_summary.py
