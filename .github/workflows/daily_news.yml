name: 모닝 스몰캡, 바이오 뉴스

on:
  # GitHub Actions의 schedule 트리거는 정확한 시각을 못 맞추고 몇 시간씩
  # 밀리는 경우가 잦다(정각을 비켜도 마찬가지). 대신 10분마다 깨어나서
  # "아직 오늘 안 보냈고 06:13이 지났으면 지금 보낸다"고 스스로 판단하게
  # 해서, 어떤 실행이 실제로 언제 돌든 06:13 이후 첫 실행에서 발송되게
  # 한다. public 저장소라 Actions 사용량은 무료다.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 발송 여부 판단
        id: gate
        run: |
          today=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          hhmm=$(TZ='Asia/Seoul' date +'%H%M')
          last_sent=$(cat data/daily_news_last_sent.txt 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "수동 실행, 바로 진행"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$last_sent" = "$today" ]; then
            echo "오늘($today) 이미 발송됨, 건너뜀"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$hhmm" < "0613" ]]; then
            echo "아직 목표 시각(06:13 KST) 전, 건너뜀 (현재 $hhmm)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "목표 시각 이후 첫 실행, 발송 진행 (현재 $hhmm)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 설치
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        if: steps.gate.outputs.proceed == 'true'
        run: pip install requests beautifulsoup4

      - name: 제약 뉴스 전송
        if: steps.gate.outputs.proceed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharma-news/scripts/send_news.py

      - name: 금융 뉴스 전송
        if: steps.gate.outputs.proceed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharma-news/scripts/send_finance_news.py

      - name: 발송 이력 커밋
        if: steps.gate.outputs.proceed == 'true'
        run: |
          TZ='Asia/Seoul' date +'%Y-%m-%d' > data/daily_news_last_sent.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_news_last_sent.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: 모닝 뉴스 발송 이력 업데이트"
          git pull --rebase origin main
          git push
