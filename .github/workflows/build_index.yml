name: 인덱스 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/uploads/**'
      - 'data/channels/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install pypdf openpyxl python-docx

      - name: 인덱스 빌드
        run: python pharma-news/scripts/build_index.py

      - name: 인덱스 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git diff --cached --quiet || git commit -m "chore: 인덱스 자동 업데이트"
          git push
