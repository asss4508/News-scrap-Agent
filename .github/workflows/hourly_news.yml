name: 시간별 스몰캡 뉴스

on:
  schedule:
    - cron: "0 0 * * 1-5"
    - cron: "20 1 * * 1-5"
    - cron: "40 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "20 5 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests beautifulsoup4
      - name: 주요 뉴스 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharma-news/scripts/send_hourly_news.py
