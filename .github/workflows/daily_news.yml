name: 모닝 스몰캡, 바이오 뉴스

on:
  # GitHub Actions의 schedule 트리거는 큐 지연이 2시간 이상 나는 경우가
  # 잦아(정각을 비켜도 마찬가지) 매일 06:13 KST를 못 맞췄다. 대신 이 PC의
  # Windows 작업 스케줄러가 정확한 시각에 `gh workflow run`으로
  # workflow_dispatch를 호출해 트리거한다. schedule을 같이 두면 뒤늦게
  # 또 돌아 중복 발송되므로 여기서는 workflow_dispatch만 남긴다.
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests beautifulsoup4
      - name: 제약 뉴스 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharma-news/scripts/send_news.py
      - name: 금융 뉴스 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharma-news/scripts/send_finance_news.py
